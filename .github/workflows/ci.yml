name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash -n install.sh
      - run: python -m unittest -v
      - name: Validate Linux installation
        run: |
          python -m pip download --only-binary=:all: --platform any -r requirements.txt -d "$RUNNER_TEMP/minekuai-wheels"
          sudo env "PATH=$PATH" "WHEEL_DIR=$RUNNER_TEMP/minekuai-wheels" bash install.sh --cold-backup
          cmp config.example.json /etc/minekuai-stop/config.json
          /opt/minekuai-stop/venv/bin/python /opt/minekuai-stop/monitor.py --help
          /opt/minekuai-stop/venv/bin/python /opt/minekuai-stop/authorize.py --help
          /opt/minekuai-stop/venv/bin/python /opt/minekuai-stop/status.py --help
          /opt/minekuai-stop/venv/bin/python /opt/minekuai-stop/cold_backup.py --help
          sudo systemd-analyze verify /etc/systemd/system/minekuai-stop.service
          sudo systemd-analyze verify /etc/systemd/system/minekuai-cold.service \
            /etc/systemd/system/minekuai-cold.timer /etc/systemd/system/minekuai-cold-recover.service \
            /etc/systemd/system/minekuai-cold-recover.timer
